# Pre-commit hooks for PersonAgent.
#
# Setup once:
#     cd @backend && uv sync --extra dev
#     uv run pre-commit install
#
# Run on demand:
#     uv run pre-commit run --all-files

# Skip the auto-fix hooks on CI -- CI should fail loudly when files drift,
# not silently rewrite them.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/ai-guides/_inventory/.*\.json$
      - id: end-of-file-fixer
        exclude: ^docs/ai-guides/_inventory/.*\.json$
      - id: check-yaml
        # PyYAML chokes on Mako (Alembic) templates; let the Alembic
        # script template through unchecked.
        exclude: ^@backend/src/personagent/infrastructure/persistence/alembic/script\.py\.mako$
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff is wired as a local hook (instead of the official ruff-pre-commit
  # action) because the backend lives under `@backend/`. Ruff treats
  # arguments starting with `@` as response-file references, so passing
  # filenames like `@backend/src/foo.py` makes it try to open
  # `backend/src/foo.py` and panic. The local hook sidesteps that by
  # running ruff with `pass_filenames: false` and letting it discover
  # files via its own config in `@backend/pyproject.toml`.
  - repo: local
    hooks:
      - id: folder-principles
        name: adr-0022 folder principles
        entry: bash -c 'cd @backend && python3 scripts/check_folder_principles.py'
        language: system
        pass_filenames: false
        files: ^@backend/src/personagent/.*\.py$

      - id: ruff
        name: ruff (backend lint)
        entry: bash -c 'cd @backend && uv run ruff check --fix --exit-non-zero-on-fix src/ tests/'
        language: system
        pass_filenames: false
        files: ^@backend/(src|tests)/.*\.py$
        # ruff-format is intentionally NOT enabled here. The backend has
        # ~100 files that would change on first run; reformatting belongs
        # in its own dedicated PR.

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
