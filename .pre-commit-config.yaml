repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args: ["--redact"]

  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff
        entry: bash -lc 'cd @backend && uv run ruff check src tests'
        language: system
        pass_filenames: false
      - id: electron-typecheck
        name: electron typecheck
        entry: bash -lc 'cd @desktop-electron && npm run typecheck'
        language: system
        pass_filenames: false
