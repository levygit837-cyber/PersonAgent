<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Árvore Florescendo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Cena principal contendo sol, paisagem e árvore -->
  <section class="scene">
    <!-- Sol que nasce -->
    <div class="sun"></div>
    <!-- Paisagem de fundo -->
    <div class="landscape">
      <!-- Solo/gramado -->
      <div class="ground"></div>
      <!-- Árvore que cresce e floresce -->
      <div class="tree">
        <div class="trunk"></div>
        <div class="branches"></div>
        <div class="flowers">
          <!-- pétalas geradas via CSS (8‑12) -->
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
