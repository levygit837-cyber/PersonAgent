# PersonAgent example configuration.
# Keep real secrets in .env or OS/user secret storage, never in this file.

app:
  name: "PersonAgent"
  version: "0.1.0"
  env: "development"
  host: "127.0.0.1"
  port: 8000
  log_level: "INFO"

personagent:
  local_auth_token: ""

postgres:
  host: "localhost"
  port: 5433
  user: "personagent"
  password: ""
  db: "personagent"

llama:
  server_url: "http://localhost:8080/v1"
  server_api_key: "local"
  model_path: ""
  ctx_size: 131072
  max_tokens: 82000
  auto_start: false

nvidia:
  api_key: ""
  base_url: "https://integrate.api.nvidia.com/v1"
  default_model: "openai/gpt-oss-120b"

vertex:
  auth_mode: "auto"
  project_id: ""
  location: "global"
  default_model: "gemini-3.1-flash-lite-preview"

kimi:
  api_key: ""
  base_url: "https://api.kimi.com/coding/v1"
  default_model: "kimi-for-coding"

deepseek:
  api_key: ""
  base_url: "https://api.deepseek.com"
  default_model: "deepseek-v4-flash"

zenmux:
  api_key: ""
  base_url: "https://zenmux.ai/api/v1"
  default_model: "deepseek/deepseek-v4-flash-free"
