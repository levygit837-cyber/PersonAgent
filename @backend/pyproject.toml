[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personagent"
version = "0.1.0"
description = "Personal agent system with llama.cpp + TurboQuant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PersonAgent Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    # Configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # HTTP Client
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "google-auth>=2.40.0",
    "playwright>=1.56.0",
    "websockets>=15.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Utilities
    "orjson>=3.10.0",
    "structlog>=25.1.0",
    "tenacity>=9.0.0",
    # Validation
    "email-validator>=2.2.0",
    # Scheduler
    "apscheduler>=3.11.0",
    "pgvector>=0.4.1",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "httpx>=0.28.0",
]

[project.scripts]
personagent = "personagent.interfaces.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/personagent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "nvidia_live: real NVIDIA NIM API tests gated by NVIDIA_LIVE_TESTS",
    "vertex_live: real Vertex AI API tests gated by VERTEX_LIVE_TESTS",
    "kimi_live: real Kimi Code API tests gated by KIMI_LIVE_TESTS",
]
