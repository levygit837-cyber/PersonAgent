# Alembic configuration for PersonAgent.
#
# All paths are resolved relative to the backend root (where this file lives).
# The database URL is **not** set here; ``env.py`` pulls it from
# ``personagent.infrastructure.config.settings`` so a single ``.env`` is the
# source of truth for both the runtime and migrations.

[alembic]
script_location = src/personagent/infrastructure/persistence/alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

# Filename template uses the revision id + slug so the versions directory stays
# readable when running ``alembic history``.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Recursive revision discovery; keep the versions tree flat for now but allow
# subdirectories for future logical groupings (e.g. ``versions/multi_tenant/``).
recursive_version_locations = true

[post_write_hooks]
# Format autogenerated revisions with ruff so they match the rest of the repo
# style without manual cleanup.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
