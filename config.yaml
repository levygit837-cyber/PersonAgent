# ============================================================
# PersonAgent — Configuração YAML
# Mesclada com variáveis de ambiente (.env)
# Prioridade: ENV > YAML > Defaults
# ============================================================

app:
  name: "PersonAgent"
  version: "0.1.0"
  env: "development"
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

postgres:
  host: "localhost"
  port: 5433
  user: "personagent"
  password: "personagent_secret"
  db: "personagent"

llama:
  server_url: "http://localhost:8080/v1"
  server_api_key: "local"
  model_path: "/home/levybonito/.lmstudio/models/Jackrong/Qwen3.5-4B-Claude-4.6-Opus-Reasoning-Distilled-v2-GGUF"
  ctx_size: 131072
  n_gpu_layers: 999
  temperature: 0.7
  max_tokens: 82000
  cache_type_k: "turbo4"
  cache_type_v: "turbo4"
  reasoning: "off"
  reasoning_budget: 2048
  verbose: false
  threads: 6
  auto_start: false
  bin_path: "./@llama/llama-cpp-turboquant/build/bin/llama-server"

nvidia:
  api_key: "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"
  base_url: "https://integrate.api.nvidia.com/v1"
  # Modelos 500B+ params disponíveis:
  # - moonshotai/kimi-k2.5 (1T params - PADRÃO)
  # - mistralai/mistral-large-3-675b-instruct-2512 (675B)
  # - qwen/qwen3-coder-480b-a35b-instruct (480B)
  # - meta/llama-3.1-405b-instruct (405B)
  default_model: "openai/gpt-oss-120b"
  models_cache_ttl_seconds: 300

operational_memory:
  enabled: true
  capture_tools_enabled: true
  recall_enabled: true
  embedding_enabled: true
  max_capture_chars: 24000
  chunk_max_chars: 4000
  recall_top_k: 6
  hot_cache_size: 100

embedding:
  server_url: "http://localhost:8081/v1"
  server_api_key: "local"
  model: "Qwen3-Embedding-8B-Q4_K_M.gguf"
  model_path: "/home/levybonito/.lmstudio/models/Qwen/Qwen3-Embedding-8B-GGUF"
  dimensions: 4096
  timeout_seconds: 60
  auto_start: true
  port: 8081
  ctx_size: 8192
  n_gpu_layers: 999
  threads: 6
  parallel: 1

vertex:
  auth_mode: "auto"
  project_id: ""
  location: "global"
  default_model: "gemini-3.1-flash-lite-preview"
  timeout_seconds: 240
  stream_read_timeout_seconds: 0
  models_cache_ttl_seconds: 300

kimi:
  api_key: ""
  base_url: "https://api.kimi.com/coding/v1"
  default_model: "kimi-for-coding"
  max_tokens: 32768
  context_window: 262144
  timeout_seconds: 240
  stream_read_timeout_seconds: 0
  anthropic_version: "2023-06-01"
